<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E1E"/>
      <stop offset="100%" stop-color="#0B0B0B"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A36"/>
      <stop offset="100%" stop-color="#D9361E"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#FF8A3D"/>
    </linearGradient>
  </defs>
  <!-- Outer Rounded Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="60" height="60" x="2" y="2" rx="14" fill="none" stroke="#FF4D2E" stroke-width="2" stroke-opacity="0.5"/>
  
  <!-- Food Box Seam Graphic -->
  <g transform="translate(7, 9)">
    <!-- Box Body -->
    <path d="M 7,16 L 25,7 L 43,16 L 43,36 L 25,45 L 7,36 Z" fill="url(#boxGrad)"/>
    <!-- Top Flaps -->
    <path d="M 7,16 L 25,25 L 43,16 L 25,7 Z" fill="#FF7B60"/>
    <path d="M 25,25 L 25,45" stroke="#9E1B09" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 7,16 L 25,25" stroke="#FFA492" stroke-width="2" stroke-linecap="round"/>
    <path d="M 43,16 L 25,25" stroke="#C42A14" stroke-width="2" stroke-linecap="round"/>
    <!-- Hot Steam / Flame Top Accent -->
    <path d="M 21,5 C 21,1 25,0 25,-4 C 29,0 33,2 29,6 C 26,9 21,8 21,5 Z" fill="url(#accentGrad)"/>
  </g>
</svg>
